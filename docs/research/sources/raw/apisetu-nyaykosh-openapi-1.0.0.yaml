openapi: 3.0.3
info:
  title: Nyaykosh - Indian Legislation & Compliance Simulator API
  version: 1.0.0
  description: |
    Open-access REST API for Indian legislation (Nyaykosh): a machine-readable
    catalogue of Acts with their provisions, personas, amendments and penalties,
    plus a compliance simulator that evaluates a persona's answers against the
    codified rules of an Act.    
    
       <i>[Updated on 14th August 2026]</i>
    
    
  contact:
    name: Nyaykosh API Support
    email: support@nyaykosh.in
    
    
  license:
    name: Government Open Data License - India GODL
    url: https://data.gov.in/government-open-data-license-india
    
servers:
- url: https://lawascode.negd.in/laac-api
  description: Production

  
tags:

- name: Content
  description: Site content used by the front end (branding, navigation, categories) and the public read-only
    view of Acts and their codified rules under /v1/public/acts.
- name: Laws
  description: Public catalogue of Acts - details, provisions, personas, amendments, penalties, and XML/PDF
    exports.
- name: Meta
  description: Service health and liveness.
- name: Simulator
  description: Compliance simulator - personas, their questionnaires, and rule evaluation.
  
paths:
  /health:
    get:
      tags:
      - Meta
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  
  /v1/laws:
    get:
      tags:
      - Laws
      summary: List Laws
      operationId: list_laws_v1_laws_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          description: Filter by category (exact).
          title: Category
          nullable: true
        description: Filter by category (exact).
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Search title / description / authority.
          title: Q
          nullable: true
        description: Search title / description / authority.
      - name: status
        in: query
        required: false
        schema:
          type: string
          description: Filter by status, e.g. 'In force'.
          title: Status
          nullable: true
        description: Filter by status, e.g. 'In force'.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Law'
                title: Response List Laws V1 Laws Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}:
    get:
      tags:
      - Laws
      summary: Get Law
      operationId: get_law_v1_laws__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Law'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}/penalties:
    get:
      tags:
      - Laws
      summary: Get Law Penalties
      operationId: get_law_penalties_v1_laws__slug__penalties_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Penalty'
                title: Response Get Law Penalties V1 Laws  Slug  Penalties Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}/provisions:
    get:
      tags:
      - Laws
      summary: Get Law Provisions
      operationId: get_law_provisions_v1_laws__slug__provisions_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provision'
                title: Response Get Law Provisions V1 Laws  Slug  Provisions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}/personas:
    get:
      tags:
      - Laws
      summary: Get Law Personas
      description: |-
        Compliance personas tied to an Act: simulator personas linked via
        lawId plus any personas parsed from the Act's AKN XML.
      operationId: get_law_personas_v1_laws__slug__personas_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActPersona'
                title: Response Get Law Personas V1 Laws  Slug  Personas Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}/amendments:
    get:
      tags:
      - Laws
      summary: Get Law Amendments
      description: Amendments recorded against an Act (parsed from its AKN XML / admin edits).
      operationId: get_law_amendments_v1_laws__slug__amendments_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActAmendment'
                title: Response Get Law Amendments V1 Laws  Slug  Amendments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}/provisions/{provision_slug}:
    get:
      tags:
      - Laws
      summary: Get Law Provision
      operationId: get_law_provision_v1_laws__slug__provisions__provision_slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: provision_slug
        in: path
        required: true
        schema:
          type: string
          title: Provision Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provision'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}/xml:
    get:
      tags:
      - Laws
      summary: Get Law Xml
      description: |-
        Serve the law as an Akoma Ntoso (LegalDocML) XML document. Powers the
        "Structured XML" download.

        If the act was imported from XML, the exact uploaded source document is
        returned (so download == upload, round-trippable). Otherwise the XML is
        generated on the fly from the stored provisions and penalties.
      operationId: get_law_xml_v1_laws__slug__xml_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Akoma Ntoso XML source of the Act.
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/laws/{slug}/pdf:
    get:
      tags:
      - Laws
      summary: Get Law Pdf
      description: |-
        Generate a reference PDF of the law (title, provisions, penalties) built
        from the stored data. Powers the "Official PDF" download.
      operationId: get_law_pdf_v1_laws__slug__pdf_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Generated reference PDF of the Act.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/simulator/personas:
    get:
      tags:
      - Simulator
      summary: List Personas
      operationId: list_personas_v1_simulator_personas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Persona'
                type: array
                title: Response List Personas V1 Simulator Personas Get
  /v1/simulator/personas/{persona_id}:
    get:
      tags:
      - Simulator
      summary: Get Persona
      operationId: get_persona_v1_simulator_personas__persona_id__get
      parameters:
      - name: persona_id
        in: path
        required: true
        schema:
          type: string
          title: Persona Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/simulator/evaluate:
    post:
      tags:
      - Simulator
      summary: Evaluate
      description: Evaluate the rules of one persona+trigger against checked checklist items.
      operationId: evaluate_v1_simulator_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/site:
    get:
      tags:
      - Content
      summary: Get Site
      operationId: get_site_v1_site_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Site V1 Site Get
  /v1/navigation:
    get:
      tags:
      - Content
      summary: Get Navigation
      operationId: get_navigation_v1_navigation_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NavLink'
                type: array
                title: Response Get Navigation V1 Navigation Get
  /v1/categories:
    get:
      tags:
      - Content
      summary: Get Categories
      operationId: get_categories_v1_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Get Categories V1 Categories Get
  /v1/public/acts:
    get:
      tags:
      - Content
      summary: List Acts
      operationId: list_acts_v1_public_acts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActSummary'
                type: array
                title: Response List Acts V1 Public Acts Get
  /v1/public/acts/{act_id}:
    get:
      tags:
      - Content
      summary: Get Act
      operationId: get_act_v1_public_acts__act_id__get
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          title: Act Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Law'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/public/acts/{act_id}/rules:
    get:
      tags:
      - Content
      summary: Get Act Rules
      description: |-
        Rules made under an act (mirrors the admin act-detail Rules tab). Powers
        the public law page's "Rules & Subordinate Legislation" section.
      operationId: get_act_rules_v1_public_acts__act_id__rules_get
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          title: Act Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActRule'
                title: Response Get Act Rules V1 Public Acts  Act Id  Rules Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

components:
  schemas:
    ActAmendment:
      properties:
        id:
          type: string
          title: Id
        amendingInstrument:
          type: string
          title: Amendinginstrument
          default: ''
        targetType:
          type: string
          title: Targettype
          default: ''
        changeType:
          type: string
          title: Changetype
          default: ''
        effectiveDate:
          type: string
          title: Effectivedate
          default: ''
        textBefore:
          type: string
          title: Textbefore
          default: ''
        textAfter:
          type: string
          title: Textafter
          default: ''
      type: object
      required:
      - id
      title: ActAmendment
    ActChapter:
      properties:
        num:
          type: string
          title: Num
        heading:
          type: string
          title: Heading
        sections:
          items:
            $ref: '#/components/schemas/ActSection'
          type: array
          title: Sections
      type: object
      required:
      - num
      - heading
      title: ActChapter
    ActDetail:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        year:
          type: integer
          title: Year
        status:
          type: string
          title: Status
        category:
          type: string
          title: Category
        authority:
          type: string
          title: Authority
        icon:
          type: string
          title: Icon
          default: scale
        shortDesc:
          type: string
          title: Shortdesc
          default: ''
        sectionsCount:
          type: integer
          title: Sectionscount
          default: 0
        lastUpdated:
          type: string
          title: Lastupdated
          default: ''
        referenceNumber:
          type: string
          title: Referencenumber
          default: ''
        frbrUri:
          type: string
          title: Frbruri
          default: ''
        sourceUri:
          type: string
          title: Sourceuri
          default: ''
        enactedDate:
          type: string
          title: Enacteddate
          default: ''
        version:
          type: integer
          title: Version
          default: 1
        hasSourceXml:
          type: boolean
          title: Hassourcexml
          default: false
        amendedDates:
          items:
            type: string
          type: array
          title: Amendeddates
        chapters:
          items:
            $ref: '#/components/schemas/ActChapter'
          type: array
          title: Chapters
        sections:
          items:
            $ref: '#/components/schemas/ActSection'
          type: array
          title: Sections
        rules:
          items:
            $ref: '#/components/schemas/ActRule'
          type: array
          title: Rules
        amendments:
          items:
            $ref: '#/components/schemas/ActAmendment'
          type: array
          title: Amendments
        penalties:
          items:
            $ref: '#/components/schemas/Penalty'
          type: array
          title: Penalties
        personas:
          items:
            $ref: '#/components/schemas/ActPersona'
          type: array
          title: Personas
        links:
          items:
            $ref: '#/components/schemas/ActLink'
          type: array
          title: Links
        counts:
          additionalProperties: true
          type: object
          title: Counts
      type: object
      required:
      - id
      - title
      - year
      - status
      - category
      - authority
      title: ActDetail
      description: |-
        The full admin detail view of an act. Built from a Law record; structures
        the Law doesn't store (chapters/amendments/links) come back empty.

        Mirrors the frontend ActDetail interface in src/types/law.ts.
    ActImportResult:
      properties:
        committed:
          type: boolean
          title: Committed
        actSlug:
          type: string
          title: Actslug
        actTitle:
          type: string
          title: Acttitle
        isNew:
          type: boolean
          title: Isnew
        counts:
          additionalProperties:
            type: integer
          type: object
          title: Counts
        issues:
          items:
            type: string
          type: array
          title: Issues
      type: object
      required:
      - committed
      - actSlug
      - actTitle
      - isNew
      title: ActImportResult
      description: |-
        Result of parsing (preview) or importing (commit) an Akoma Ntoso XML act.

        Mirrors the frontend ImportResult interface in ImportActView.tsx.
    ActLink:
      properties:
        id:
          type: string
          title: Id
        relType:
          type: string
          title: Reltype
          default: ''
        pinpoint:
          type: string
          title: Pinpoint
          default: ''
        note:
          type: string
          title: Note
          default: ''
        targetDocId:
          type: string
          title: Targetdocid
          default: ''
        targetSlug:
          type: string
          title: Targetslug
          default: ''
      type: object
      required:
      - id
      title: ActLink
    ActPersona:
      properties:
        id:
          type: string
          title: Id
        key:
          type: string
          title: Key
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        category:
          type: string
          title: Category
          default: ''
      type: object
      required:
      - id
      - key
      - name
      title: ActPersona
    ActPersonaCreate:
      properties:
        name:
          type: string
          title: Name
        category:
          type: string
          title: Category
          default: ''
        description:
          type: string
          title: Description
          default: ''
      type: object
      required:
      - name
      title: ActPersonaCreate
    ActRule:
      properties:
        id:
          type: string
          title: Id
        num:
          type: string
          title: Num
        label:
          type: string
          title: Label
        heading:
          type: string
          title: Heading
        text:
          type: string
          title: Text
          default: ''
      type: object
      required:
      - id
      - num
      - label
      - heading
      title: ActRule
    ActSection:
      properties:
        id:
          type: string
          title: Id
        num:
          type: string
          title: Num
        label:
          type: string
          title: Label
        heading:
          type: string
          title: Heading
        text:
          type: string
          title: Text
          default: ''
        ordinal:
          type: integer
          title: Ordinal
          default: 0
      type: object
      required:
      - id
      - num
      - label
      - heading
      title: ActSection
    ActSectionCreate:
      properties:
        num:
          type: string
          title: Num
          default: ''
        heading:
          type: string
          title: Heading
        text:
          type: string
          title: Text
          default: ''
      type: object
      required:
      - heading
      title: ActSectionCreate
    ActSummary:
      properties:
        id:
          type: string
          title: Id
        apiSlug:
          type: string
          title: Apislug
        title:
          type: string
          title: Title
        year:
          type: integer
          title: Year
        category:
          type: string
          title: Category
        authority:
          type: string
          title: Authority
        status:
          type: string
          title: Status
        shortDesc:
          type: string
          title: Shortdesc
        sections:
          type: integer
          title: Sections
      type: object
      required:
      - id
      - apiSlug
      - title
      - year
      - category
      - authority
      - status
      - shortDesc
      - sections
      title: ActSummary
      description: |-
        A law exposed as a summary for the admin Acts listing.

        An "act" is a Law record; this is the subset of fields the Acts table shows.
        Mirrors the frontend ActSummary interface in src/types/law.ts.
    AdminProfile:
      properties:
        email:
          type: string
          format: email
          title: Email
        role:
          type: string
          title: Role
        permissions:
          items:
            type: string
          type: array
          title: Permissions
      type: object
      required:
      - email
      - role
      - permissions
      title: AdminProfile
      description: |-
        Identity + resolved RBAC context, returned by /auth/me.

        permissions is the user's *effective* permission set (role permissions
        plus any direct grants), which the frontend uses to build the dynamic
        sidebar and gate actions.
    AdminStats:
      properties:
        laws:
          type: integer
          title: Laws
        provisions:
          type: integer
          title: Provisions
        personas:
          type: integer
          title: Personas
        triggers:
          type: integer
          title: Triggers
        rules:
          type: integer
          title: Rules
        mandatoryRules:
          type: integer
          title: Mandatoryrules
        recommendedRules:
          type: integer
          title: Recommendedrules
        totalPenaltyExposure:
          type: number
          title: Totalpenaltyexposure
        inForceLaws:
          type: integer
          title: Inforcelaws
      type: object
      required:
      - laws
      - provisions
      - personas
      - triggers
      - rules
      - mandatoryRules
      - recommendedRules
      - totalPenaltyExposure
      - inForceLaws
      title: AdminStats
    AmendmentCreate:
      properties:
        amendingInstrument:
          type: string
          title: Amendinginstrument
          default: ''
        targetType:
          type: string
          title: Targettype
          default: ''
        changeType:
          type: string
          title: Changetype
          default: ''
        effectiveDate:
          type: string
          title: Effectivedate
          default: ''
        textBefore:
          type: string
          title: Textbefore
          default: ''
        textAfter:
          type: string
          title: Textafter
          default: ''
      type: object
      title: AmendmentCreate
    Body_commit_act_import_v1_admin_acts_import_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_commit_act_import_v1_admin_acts_import_post
    Body_commit_import_v1_admin_rules_import_post:
      properties:
        file:
          type: string
          format: binary
          title: File
        lawId:
          type: string
          title: Lawid
          nullable: true
      type: object
      required:
      - file
      title: Body_commit_import_v1_admin_rules_import_post
    Body_preview_act_import_v1_admin_acts_import_preview_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_preview_act_import_v1_admin_acts_import_preview_post
    Body_preview_import_v1_admin_rules_preview_post:
      properties:
        file:
          type: string
          format: binary
          title: File
        lawId:
          type: string
          title: Lawid
          nullable: true
      type: object
      required:
      - file
      title: Body_preview_import_v1_admin_rules_preview_post
    Body_update_act_xml_v1_admin_acts__act_id__xml_put:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_update_act_xml_v1_admin_acts__act_id__xml_put
    ComplianceRule:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        tier:
          type: string
          enum:
          - mandatory
          - recommended
          title: Tier
        clauses:
          items:
            type: string
          type: array
          title: Clauses
        actions:
          items:
            type: string
          type: array
          title: Actions
        artifacts:
          items:
            type: string
          type: array
          title: Artifacts
